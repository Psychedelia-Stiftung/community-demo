<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1320">
<link rel="icon" href="data:,">
</head>
<body>
<title>Community</title>
<style>
  html, body { background: #0c1320; }
  .boot { min-height: 100%; display: flex; align-items: center; justify-content: center; color: #a3b4c3; font: 15px -apple-system, system-ui, sans-serif; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Schibsted+Grotesk:wght@400..700&display=swap">
<link rel="stylesheet" href="app.css">

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; width: 0; height: 0; overflow: hidden">
  <defs>
    <radialGradient id="pfLight" cx="28%" cy="22%" r="85%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0b1729" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="pfSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
</svg>

<div id="app"><div class="boot">Community wird geladen</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="filePick" type="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<noscript><p style="padding: 24px; color: #edf1ef">Community braucht JavaScript.</p></noscript>
<script src="app.js"></script>

</body>
</html>
